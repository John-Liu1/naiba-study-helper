<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
  body { width:268px; margin:0; font:13px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif; color:#3b2f18; background:#fffcf3; }
  .hd { background:linear-gradient(135deg,#ffd978,#f5bc3c); color:#57390a; padding:10px 14px; font-weight:700; display:flex; align-items:center; gap:8px; }
  .hd img { width:22px; height:22px; border-radius:50%; background:#fff; box-shadow:0 1px 3px rgba(90,60,10,.28); }
  .bd { padding:12px 14px; }
  .lv { display:block; border:1px solid #f0e2c4; border-radius:8px; padding:8px 10px; margin-bottom:8px; cursor:pointer; background:rgba(255,255,255,.8); }
  .lv.on { border-color:#e8b44a; background:#fff8ea; }
  .lv b { font-size:13px; } .lv span { display:block; font-size:11px; color:#7a838d; }
  .st { font-size:12px; color:#7a838d; margin:10px 0; }
  button { width:100%; border:1px solid #f0e2c4; background:#fff; border-radius:7px; padding:7px; font:13px inherit; cursor:pointer; color:#57390a; }
</style>
</head>
<body>
<div class="hd"><img src="icons/icon48.png" alt="">学习通-无敌智慧奶娃学习助手</div>
<div class="bd">
  <div class="lv" data-lv="readonly"><b>只读档</b><span>只解析，不填不交</span></div>
  <div class="lv" data-lv="semi"><b>半自动</b><span>自动填，你点提交</span></div>
  <div class="lv" data-lv="full"><b>全自动</b><span>达标直接交</span></div>
  <div class="st" id="st">读取中…</div>
  <button id="opt">打开完整设置</button>
</div>
<script src="popup.js"></script>
</body>
</html>
